{{- if .Values.migrations -}}
{{- if eq .Values.migrations "bootstrap" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-kong-bootstrap
  labels: {{ include "kong.labels" $ | nindent 4 }}
spec:
  backoffLimit: {{ .Values.kong_admin.setupJob.backoffLimit | default 15 }}
  activeDeadlineSeconds: {{ .Values.kong_admin.setupJob.activeDeadlineSeconds | default 3600 }}
  template:
    spec:
      {{- include "image_pull_secrets" $ | indent 6 }}
      initContainers:
      - name: "check-database"
        image: '{{ include "postgresql.image" $ }}'
        imagePullPolicy: Always
        securityContext: {{ .Values.postgres.securityContext | toYaml | nindent 10 }}
        command: ['/bin/bash']
        args: ['-c', 'until pg_isready -U {{ .Values.postgres.user }}; do echo waiting for database; sleep 2; done;']
        env:
        {{- include "kong.migrations.checkdatabase.env" $ | indent 8 }}
      containers:
      - name: kong-bootstrap
        image: {{ include "kong.image" $ }}
        imagePullPolicy: Always
        securityContext: {{ default .Values.securityContext | toYaml | nindent 10 }}
        env:
        {{- include "kong.migrations.env" $ | indent 8 }}
        command: [ "/bin/sh", "-c", "KONG_NGINX_DAEMON='off' kong migrations bootstrap" ]
        volumeMounts:
          {{- include "kong.volumeMounts" $ | indent 8 }}
      restartPolicy: OnFailure
      volumes:
      {{- include "kong.volumes" $ | indent 6 }}
{{- end -}}
{{- end -}}