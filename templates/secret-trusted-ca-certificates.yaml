{{- if or (eq .Values.sslVerify true) .Values.zipkin.luaSslTrustedCertificate .Values.postgres.externalDatabase.sslVerify }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-trusted-ca-certificates-migrations
  labels: {{- include "kong.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
type: Opaque
data:
{{- if eq .Values.sslVerify true }}
  trusted-ca-certificates.pem: {{ (.Values.trustedCaCertificates | default "# Set trustedCaCertificates in values.yaml") | b64enc }}
{{- end }}
{{- if or .Values.zipkin.luaSslTrustedCertificate .Values.postgres.externalDatabase.sslVerify }}
  lua-ssl-trusted-certificates.pem: {{ (include "kong.luaSslTrustedCertificates" $  | default "# Set luaSslTrustedCertificate in values.yaml") | b64enc }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-trusted-ca-certificates
  labels: {{- include "kong.labels" $ | nindent 4 }}
type: Opaque
data:
{{- if eq .Values.sslVerify true }}
  trusted-ca-certificates.pem: {{ (.Values.trustedCaCertificates | default "# Set trustedCaCertificates in values.yaml") | b64enc }}
{{- end }}
{{- if or .Values.zipkin.luaSslTrustedCertificate .Values.postgres.externalDatabase.sslVerify }}
  lua-ssl-trusted-certificates.pem: {{ (include "kong.luaSslTrustedCertificates" $  | default "# Set luaSslTrustedCertificate in values.yaml") | b64enc }}
{{- end }}
{{- end -}}