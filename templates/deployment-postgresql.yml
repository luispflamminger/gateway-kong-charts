{{- if not .Values.postgres.externalDatabase.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgresql
  labels: {{ include "postgresql.labels" $ | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{ include "postgresql.selector" $ | nindent 6 }}
  template:
    metadata:
      labels: 
        {{- include "postgresql.labels" $ | nindent 8 }}
        {{- include "common.status-monitor.labels" $ | nindent 8 }}
        {{- include "database.status-monitor.labels" $ | nindent 8 }}
    spec:
      {{- include "image_pull_secrets" $ | indent 6 }}
      securityContext:{{ .Values.postgres.podSecurityContext | toYaml | nindent 8 }}
      containers:
      - name: {{ .Release.Name }}-postgresql
        image: {{ include "postgresql.image" $ }}
        imagePullPolicy: {{ .Values.postgres.imagePullPolicy | default .Values.global.imagePullPolicy }}
        securityContext: {{ .Values.postgres.containerSecurityContext | toYaml | nindent 10 }}
        env:
        {{- include "postgresql.env" $ | indent 8 }}
        livenessProbe:
          tcpSocket:
            port:  {{ .Values.postgres.port }}
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        ports:
        - containerPort: {{ .Values.postgres.port }}
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - 'pg_isready -U kong'
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
{{- toYaml .Values.postgres.resources | nindent 10 }}
        terminationMessagePath: /dev/termination-log
        volumeMounts:
        - mountPath: /tmp
          name: {{ .Release.Name }}-postgresql-tmp
        - mountPath: /var/run/postgresql
          name: {{ .Release.Name }}-postgresql-run
        - mountPath: {{ .Values.postgres.mountDir | default "/var/lib/postgresql/data" }}
          name: {{ .Release.Name }}-postgresql-data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
      - name: {{ .Release.Name }}-postgresql-run
        emptyDir: {}
      - name: {{ .Release.Name }}-postgresql-tmp
        emptyDir: {}
      - name: {{ .Release.Name }}-postgresql-data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-database-pvc
{{- end -}}
