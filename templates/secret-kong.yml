{{- if eq (include "kong.isEnterprise" $ ) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  labels: {{ include "kong.labels" $ | nindent 4 }}
type: Opaque
data:
  license: {{ .Values.enterprise.license | b64enc | quote }}
{{- if .Values.rbac.enabled }}
  kongAdminPassword: {{ .Values.rbac.kongAdminPassword | b64enc | quote }}
{{- end }}
  postgresPassword: {{ .Values.postgres.password | b64enc | quote }}
{{- end -}}
