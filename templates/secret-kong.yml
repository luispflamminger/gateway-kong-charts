{{- if eq (include "kong.isEnterprise" $ ) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  labels: {{ include "kong.labels" $ | nindent 4 }}
type: Opaque
data:
  license: {{ .Values.enterprise.license | b64enc }}
{{- if .Values.rbac.enabled }}
  kongAdminPassword: {{ (.Values.rbac.kongAdminPassword | default "superuser") | b64enc }}
{{- end }}
{{- end -}}