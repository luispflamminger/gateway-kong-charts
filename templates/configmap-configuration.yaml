{{- if eq (include "kong.configuration" $) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-configuration
  labels: {{ include "kong.labels" $ | nindent 4 }}
data:
  configuration.sh: |
    {{- if hasKey .Values "configuration" }}
    {{- .Values.configuration | nindent 4 }}
    {{- else }}
    {{- $apiUrl := include "kong.adminApi.serviceUrl" . }}
    echo 1
    echo "create service (upstream: http://localhost:8001)"
    curl --request PUT \
      --url {{ $apiUrl }}/services/{{ include "kong.adminApi.name" . }} \
      --header 'Content-Type: application/json' \
      --header "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN_BASE64" \
      --data '{
          "host": "localhost",
          "protocol": "http",
          "port": 8001,
          "name": "{{ include "kong.adminApi.name" . }}"
      }'

    echo 2
    echo "create request transformer plugin for setting api key header"
    curl --request PUT \
      --url {{ $apiUrl }}/services/{{ include "kong.adminApi.name" . }}/plugins/{{ .Values.requestTransformer.setupJob.pluginId }} \
      --header "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN_BASE64" \
      --data 'name=request-transformer' \
      --data 'config.replace.headers=Authorization:Basic $X_TARDIS_GATEWAY_ADMIN_BASE64'

    echo 3
    echo "create route (/{{ include "kong.adminApi.name" . }}) variable: hosts"
    curl --request PUT \
      --url {{ $apiUrl }}/services/{{ include "kong.adminApi.name" . }}/routes/{{ include "kong.adminApi.name" . }} \
      --header 'Content-Type: application/json' \
      --header "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN_BASE64" \
      --data '{
      "protocols": [
        "http",
        "https"
      ],
      "hosts": [
        "{{- if or (hasKey .Values "configuration") (eq (include "kong.isEnterprise" $ ) "true") (eq .Values.adminApi.ingress.enabled false) }}
         {{- include "kong.proxy.host" . }}"
         {{- else }}
         {{- include "kong.adminApi.host" . }}
         {{- end }}"
      ],
      "name": "{{ include "kong.adminApi.name" . }}",
      "paths": [
        "/{{ include "kong.adminApi.name" . }}"
      ]
    }'

    echo 4
    echo "create consumer (rover)"
    curl --request PUT \
      --url {{ $apiUrl }}/consumers/rover \
      --header 'Content-Type: application/json' \
      --header "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN_BASE64" \
      --data '{
          "username" : "rover",
          "custom_id": "rover"
        }'

    echo 5
    echo "apply acl plugin to route (/{{ include "kong.adminApi.name" . }})"
    echo "and allow group (rover)"
    curl --request PUT \
      --url {{ $apiUrl }}/routes/{{ include "kong.adminApi.name" . }}/plugins/{{ .Values.acl.setupJob.pluginId }} \
      --header 'Content-Type: application/json' \
      --header "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN_BASE64" \
      --data '{
      "name": "acl",
      "config": {
      "allow":["rover"],
      "hide_groups_header": true
      }
    }'

    echo 6
    echo "add consumer (rover) to group (rover)"
    curl --request POST \
      --url {{ $apiUrl }}/consumers/rover/acls \
      --header 'Content-Type: application/json' \
      --header "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN_BASE64" \
      --data '{
      "group": "rover"
    }'

{{- if eq .Values.jwtKeycloak.enabled true }}
    echo 7
    echo "setup plugin (jwt-keycloak)"
    echo "variable [allowed_iss]"
    curl --request PUT \
      --url {{ $apiUrl }}/routes/{{ include "kong.adminApi.name" . }}/plugins/{{ .Values.jwtKeycloak.setupJob.pluginId }} \
      --header 'Content-Type: application/json' \
      --header "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN_BASE64" \
      --data '{
      "name": "jwt-keycloak",
      "config": {
      "allowed_iss" : [{{- include "kong.jwtKeycloak.allowedIss" . -}}],
      "consumer_match" : true,
      "consumer_match_claim_custom_id" : true
      }
    }'
{{- end -}}
    {{- end -}}
{{- end -}}
