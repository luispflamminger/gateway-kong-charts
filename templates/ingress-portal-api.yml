{{- if and (eq .Values.portal.enabled true) .Values.enterprise.license }}
{{- if eq .Values.global.platform "kubernetes" }}
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-portal-api
  labels: {{ include "kong.labels" $ | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: {{ .Release.Name }}-portal-api-{{ .Release.Namespace }}.{{ .Values.global.domain.internal.url }}
    http:
      paths:
        - path: /
          backend:
            serviceName: {{ .Release.Name }}-portal-api
            servicePort: kong-portal-api
{{- end }}
{{- end }}