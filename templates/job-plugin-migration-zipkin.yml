{{- if and (include "kong.isMigrationsJob" $) (.Values.adminApi.enabled) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kong.fullname" . }}-plugin-migration-zipkin
  labels: {{ include "kong.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/weight": "-10"
spec:
  backoffLimit: {{ .Values.setupJobs.backoffLimit | default 15 }}
  activeDeadlineSeconds: {{ .Values.setupJobs.activeDeadlineSeconds | default 3600 }}
  template:
    spec:
      {{- include "image_pull_secrets" $ | indent 6 }}
      containers:
      - name: zipkin-deletion
        image: {{ include "job.image" $ }}
        securityContext: {{ default .Values.jobs.containerSecurityContext | toYaml | nindent 10 }}
        env:
        - name: X_TARDIS_GATEWAY_ADMIN_BASE64
          valueFrom:
            secretKeyRef:
              name: {{ include "kong.fullname" . }}
              key: gatewayAdminBase64
        command:        
          - /bin/bash
          - -c
          - |-
            echo "Removing old Kong ENI flavoured Zipkin plugin via DELETE {{ include "kong.adminApi.serviceUrl" . }}/plugins"

            ADMIN_API_HTTP_RETURN_CODE=`curl -Is -o /dev/null -w "%{http_code}" -H "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN_BASE64" -X GET {{ include "kong.adminApi.serviceUrl" . }}`
            if [ "$ADMIN_API_HTTP_RETURN_CODE" != "200" ]; then
                echo "Kong Admin-API unreachable"
                exit 1
            fi

            CONFIG_CALL_HTTP_RETURN_CODE=`curl \
            -o /dev/null \
            -w "%{http_code}" \
            -H "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN_BASE64" \
            -X DELETE {{ include "kong.adminApi.serviceUrl" . }}/plugins/{{ .Values.plugins.zipkin.pluginId }}`

            if [ "$CONFIG_CALL_HTTP_RETURN_CODE" != "204" ]; then
              echo "Plugin deletion failed"
              exit 1
            fi
      restartPolicy: OnFailure
{{- end -}}
