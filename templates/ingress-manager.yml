{{- if or (eq .Values.global.platform "kubernetes") (eq .Values.global.platform "tdi") -}}
{{- if and .Values.manager.ingress.enabled .Values.manager.enabled true (eq (include "kong.isEnterprise" $ ) "true") -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-manager
  labels: {{ include "kong.labels" $ | nindent 4 }}
{{- include "kong.merged.manager.annotations" $ | nindent 2 }}
spec:
  rules:
  - host: {{ include "kong.manager.host" . }}
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ .Release.Name }}-manager
              port:
{{- if .Values.manager.tls.enabled }}
                name: manager-ssl
{{- else }}
                name: manager
{{- end }}
{{- include "kong.manager.ingress.ingressClassName" . | nindent 2 }}
  tls:
  - hosts:
    - {{ include "kong.manager.host" . }}
{{- include "kong.manager.ingress.tlsSecret" . | nindent 4 -}}
{{- end -}}
{{- end -}}
