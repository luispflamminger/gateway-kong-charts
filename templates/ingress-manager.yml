{{- if eq .Values.global.platform "kubernetes" }}
{{- if and .Values.manager.ingress.enabled .Values.manager.enabled true (eq (include "kong.isEnterprise" $ ) "true") -}}
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-manager
  labels: {{ include "kong.labels" $ | nindent 4 }}
  annotations:
{{- if .Values.manager.ingress.annotations }}
    {{- toYaml .Values.manager.ingress.annotations | nindent 4 }}
{{- else }}
{{- if .Values.manager.tls.enabled }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
{{- end }}
    external-dns.alpha.kubernetes.io/hostname: {{ include "kong.manager.host" . }}
    external-dns.alpha.kubernetes.io/target: {{ .Values.global.externalDnsTarget }}
    kubernetes.io/ingress.class: external-nginx
{{- end }}
spec:
  rules:
  - host: {{ include "kong.manager.host" . }}
    http:
      paths:
        - path: /
          backend:
            serviceName: {{ .Release.Name }}-manager
{{- if .Values.manager.tls.enabled }}
            servicePort: manager-ssl
{{- else }}
            servicePort: manager
{{- end -}}
{{- end -}}
{{- end -}}