apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  annotations:
  {{- include "kong.annotations" $ | nindent 4 }}
  {{- include "kong.checksums" $ | nindent 4 }}
  labels: {{ include "kong.labels" $ | nindent 4 }}
spec:
{{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas | default 1 }}
{{- end }}
  selector: 
    matchLabels: {{ include "kong.selector" $ | nindent 6 }}
  template:
    metadata:
      annotations: 
      {{- include "kong.annotations" $ | nindent 8 }}
      {{- include "kong.checksums" $ | nindent 8 }}
{{- if eq .Values.prometheus.enabled true }}
        prometheus.io/path: '{{ .Values.prometheus.path | default "/metrics" }}'
        prometheus.io/scrape: 'true'
        prometheus.io/port: '{{ .Values.prometheus.port | default 9542 }}'
{{- end }}
      labels: 
        {{- include "kong.labels" $ | nindent 8 }}
        {{- include "common.status-monitor.labels" $ | nindent 8 }}
        {{- include "status-monitor.labels" $ | nindent 8 }}
    spec:
      {{- include "image_pull_secrets" $ | indent 6 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                  - {{ .Release.Name }}-kong
              topologyKey: "kubernetes.io/hostname"
      initContainers:
      - name: kong-install-plugins
        image: {{ include "kongplugins.image" $ }}
        imagePullPolicy: {{ .Values.imagePullPolicy | default .Values.global.imagePullPolicy }}
        securityContext: {{ default .Values.plugins.securityContext | toYaml | nindent 10 }}
        resources: {{ .Values.plugins.resources | toYaml | nindent 10 }}
        command:
        - /bin/sh
        - -c
        - |-
          mkdir -p /tmp/plugins
          cp -r /usr/local/kong/plugins/. /tmp/plugins
          luarocks-admin make-manifest /tmp/plugins
          luarocks --from=/tmp/plugins install --local kong-plugin-jwt-keycloak
          luarocks --from=/tmp/plugins install --local kong-plugin-eni-zipkin
          luarocks --from=/tmp/plugins install --local kong-plugin-eni-prometheus
          luarocks --from=/tmp/plugins install --local luaossl OPENSSL_ CRYPTO_
        volumeMounts:
          {{- include "kongplugins.volumeMounts" $ | indent 8 }}
      containers:
{{- if eq .Values.jumper.enabled true }}
      - name: jumper
        image: {{ include "kong.jumper.image" $ }}
        imagePullPolicy: {{ .Values.jumper.imagePullPolicy | default .Values.global.imagePullPolicy }}
        securityContext: {{ default .Values.jumper.securityContext | toYaml | nindent 10 }}
        resources: {{ .Values.jumper.resources | toYaml | nindent 10 }}
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "65"]
        ports:
        - containerPort: {{ .Values.jumper.port | default 8080 }} 
          name: jumper
          protocol: TCP
        volumeMounts:
          {{- include "kong.jumper.volumeMounts" $ | indent 8 }}
        env:
        - name: JUMPER_PORT
          value: {{ .Values.jumper.port | default 8080 | quote }}
        {{- include "kong.jumper.env" $ | indent 8 }}
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: jumper
            scheme: HTTP
          initialDelaySeconds: 25
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: jumper
            scheme: HTTP
          initialDelaySeconds: 25
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 6
{{- end }}
{{- if eq .Values.legacyJumper.enabled true }}
      - name: legacy-jumper
        image: {{ include "kong.legacyJumper.image" $ }}
        imagePullPolicy: {{ .Values.legacyJumper.imagePullPolicy | default .Values.global.imagePullPolicy }}
        securityContext: {{ default .Values.jumper.securityContext | toYaml | nindent 10 }}
        resources: {{ .Values.jumper.resources | toYaml | nindent 10 }}
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "65"]
        ports:
        - containerPort: {{ .Values.legacyJumper.port | default 8082 }} 
          name: legacy-jumper
          protocol: TCP
        volumeMounts:
          {{- include "kong.jumper.volumeMounts" $ | indent 8 }}
        env:
        - name: JUMPER_PORT
          value: {{ .Values.legacyJumper.port | default 8082 | quote }}
        {{- include "kong.jumper.env" $ | indent 8 }}
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: legacy-jumper
            scheme: HTTP
          initialDelaySeconds: 25
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: legacy-jumper
            scheme: HTTP
          initialDelaySeconds: 25
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 6
{{- end }}
{{- if eq .Values.issuerService.enabled true }}
      - name: issuer-service
        image: {{ include "kong.issuerService.image" $ }}
        imagePullPolicy: {{ .Values.issuerService.imagePullPolicy | default .Values.global.imagePullPolicy }}
        securityContext: {{ default .Values.issuerService.securityContext | toYaml | nindent 10 }}
        resources: {{ .Values.issuerService.resources | toYaml | nindent 10 }}
        ports:
        - containerPort: {{ .Values.issuerService.port | default 8081 }} 
          name: issuer-service
          protocol: TCP
        volumeMounts:
          {{- include "kong.issuerService.volumeMounts" $ | indent 8 }}
        env:
        {{- include "kong.issuerService.env" $ | indent 8 }}
{{- end }}
{{- if eq .Values.circuitbreaker.enabled true }}
      - name: circuitbreaker
        image: {{ include "kong.circuitbreaker.image" $ }}
        imagePullPolicy: {{ .Values.circuitbreaker.imagePullPolicy | default .Values.global.imagePullPolicy }}
        securityContext: {{ default .Values.circuitbreaker.securityContext | toYaml | nindent 10 }}
        resources: {{ .Values.circuitbreaker.resources | toYaml | nindent 10 }}
        ports:
        - name: circuitbreaker
          containerPort: {{ .Values.circuitbreaker.port | default 8084 }} 
          protocol: TCP
        volumeMounts:
          {{- include "kong.circuitbreaker.volumeMounts" $ | indent 8 }}
        env:
        {{- include "kong.circuitbreaker.env" $ | indent 8 }}
{{- end }}
      - name: kong
        image: {{ include "kong.image" $ }}
        imagePullPolicy: {{ .Values.imagePullPolicy | default .Values.global.imagePullPolicy }}
        securityContext: {{ default .Values.securityContext | toYaml | nindent 10 }}
        env:
        {{- include "kong.nginx.directives" $ | indent 8 }}
        {{- include "kong.customPlugins.env" $ | indent 8 }}
        {{- include "kong.env" $ | indent 8 }}
        command: [ "/bin/sh", "-c", "KONG_NGINX_DAEMON='off' kong start" ]
        resources: {{ .Values.resources | toYaml | nindent 10 }}
        ports:
{{- if .Values.proxy.tls.enabled }}
        - name: proxy-ssl
          containerPort: 8443
          protocol: TCP
{{- else }}
        - name: proxy
          containerPort: 8000
          protocol: TCP
{{- end -}}
{{- if .Values.prometheus.enabled }}
        - name: metrics
          containerPort: {{ .Values.prometheus.port | default 9542 }}
          protocol: TCP
{{- end -}}
{{- if .Values.adminApi.enabled -}}
{{- if .Values.adminApi.tls.enabled }}
        - name: admin-ssl
          containerPort: 8444
          protocol: TCP
{{- else }}
        - name: admin
          containerPort: 8001
          protocol: TCP
{{- end -}}
{{- end }}
{{- if and (eq .Values.manager.enabled true) (eq (include "kong.isEnterprise" $ ) "true") -}}
{{- if .Values.manager.tls.enabled }}
        - name: manager-ssl
          containerPort: 8445
          protocol: TCP
{{- else }}
        - name: manager
          containerPort: 8002
          protocol: TCP
{{- end -}}
{{- end -}}
{{- if and (eq .Values.portal.enabled true) (eq (include "kong.isEnterprise" $ ) "true") -}}
{{- if .Values.portal.tls.enabled }}
        - name: portal-ssl
          containerPort: 8446
          protocol: TCP
        - name: portal-api-ssl
          containerPort: 8447
          protocol: TCP
{{- else }}
        - name: portal
          containerPort: 8003
          protocol: TCP
        - name: portal-api
          containerPort: 8004
          protocol: TCP
{{- end -}}
{{- end }}
        - name: status
          containerPort: 8100
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /status
            port: status
            scheme: HTTP
          initialDelaySeconds: 5
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /status
            port: status
            scheme: HTTP
          initialDelaySeconds: 5
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3

        terminationMessagePath: /dev/termination-log
        volumeMounts:
        {{- include "kong.volumeMounts" $ | indent 8 }}
      volumes:
      {{- include "kongplugins.volumes" $ | indent 6 }}
      {{- include "kong.volumes" $ | indent 6 }}
      {{- include "kong.jumper.volumes" $ | indent 6 }}
      {{- include "kong.issuerService.volumes" $ | indent 6 }}
      {{- include "kong.circuitbreaker.volumes" $ | indent 6 }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 80
