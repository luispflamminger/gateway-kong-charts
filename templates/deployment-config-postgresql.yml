apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgresql
  labels: {{ include "postgresql.labels" $ | nindent 4 }}
spec:
  replicas: {{ .Values.postgres.replicas | default 1 }}
  selector:
    matchLabels: {{ include "postgresql.selector" $ | nindent 6 }}
  template:
    metadata:
      labels: {{ include "postgresql.labels" $ | nindent 8 }}
    spec:
      containers:
      - name: {{ .Release.Name }}-postgresql
        image: '{{ .Values.postgres.image | default "postgres:9.5" }}'
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_USER
          value: {{ .Values.postgres.user | default "kong" }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-postgresql
              key: password
        - name: POSTGRES_DB
          value: {{ .Values.postgres.database | default "kong" }}
        # for centos and rhel we do have different environment variables
        - name: POSTGRESQL_USER
          value: {{ .Values.postgres.user | default "kong" }}
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-postgresql
              key: password
        - name: POSTGRESQL_DATABASE
          value: {{ .Values.postgres.database | default "kong" }}
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - 'pg_isready -U kong'
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        ports:
        - containerPort: 5432
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - 'pg_isready -U kong'
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            memory: {{ .Values.postgres.resources.limits.memory }}
        terminationMessagePath: /dev/termination-log
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: {{ .Release.Name }}-postgresql-data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
      - name: {{ .Release.Name }}-postgresql-data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-database-pvc