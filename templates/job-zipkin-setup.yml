{{- if and (.Values.adminApi.enabled) (.Values.zipkin.enabled) ( not ( eq .Values.zipkin.collectorUrl "" )) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-zipkin-setup
  labels: {{ include "kong.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.zipkin.setupJob.backoffLimit | default 15 }}
  activeDeadlineSeconds: {{ .Values.zipkin.setupJob.activeDeadlineSeconds | default 3600 }}
  template:
    spec:
      {{- include "image_pull_secrets" $ | indent 6 }}
      containers:
      - name: tif-base-image
        image: {{ include "job.image" $ }}
        securityContext: {{ default .Values.jobs.securityContext | toYaml | nindent 10 }}
        env:
        - name: X_TARDIS_GATEWAY_ADMIN_BASE64
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}
              key: gatewayAdminBase64
        {{- if eq .Values.rbac.enabled true }}
        - name: KONG_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}
              key: kongAdminPassword
         {{- end }}
        command:        
          - /bin/bash
          - -c
          - |- 
            echo "Enabling Kong ENI flavoured Zipkin plugin via PUT {{ include "kong.adminApi.serviceUrl" . }}/plugins"

            ADMIN_API_HTTP_RETURN_CODE=`curl -Is -o /dev/null -w "%{http_code}" -H "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN_BASE64" {{ if eq .Values.rbac.enabled true -}}-H "Kong-Admin-Token:$KONG_ADMIN_PASSWORD"{{- end }} -X GET {{ include "kong.adminApi.serviceUrl" . }}`
            if [ "$ADMIN_API_HTTP_RETURN_CODE" == "200" ]; then
                echo "Kong Admin-API unreachable"
                exit 1
            fi

            CONFIG_CALL_HTTP_RETURN_CODE=`curl \
            -w "%{http_code}" \
            -H "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN_BASE64" \
            {{- if eq .Values.rbac.enabled true }}
            -H "Kong-Admin-Token:$KONG_ADMIN_PASSWORD" \
            {{- end }}
            -X PUT {{ include "kong.adminApi.serviceUrl" . }}/plugins/{{ .Values.zipkin.setupJob.pluginId }} \
            --header 'Content-Type: application/json' \
            --data \
            '{
              "name" : "zipkin",
              "tags" : ["tardis","zipkin","eni-zipkin"],
              "config" : {
                "http_endpoint" : "{{ .Values.zipkin.collectorUrl }}",
                "sample_ratio" : {{ .Values.zipkin.sampleRatio | default 0.001 }},
                "include_credential" : {{ .Values.zipkin.includeCredential | default true }},
                "default_service_name" : "{{ .Values.zipkin.defaultServiceName | default .Release.Name }}",
                "local_component_name" : "{{ .Values.zipkin.defaultServiceName | default .Release.Name }}"
              }
            }'`

            if [ "$CONFIG_CALL_HTTP_RETURN_CODE" != "200" ] && [ "$CONFIG_CALL_HTTP_RETURN_CODE" != "201" ]; then
              echo "Configuring plugin failed"
              exit 1
            fi

      restartPolicy: OnFailure
{{- end }}
