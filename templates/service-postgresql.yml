{{- if eq .Values.database.location "local" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "postgresql.serviceName" . }}
  labels: {{ include "postgresql.labels" $ | nindent 4 }}
spec:
  selector: {{ include "postgresql.selector" $ | nindent 4 }}
  ports:
  - name: postgresql
    protocol: TCP
    port: 5432
    targetPort: 5432
{{- end -}}