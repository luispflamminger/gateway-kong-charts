{{- if and (.Values.adminApi.enabled) (eq .Values.prometheus.enabled true) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-prometheus-setup
  labels: {{ include "kong.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.prometheus.setupJob.backoffLimit | default 15 }}
  activeDeadlineSeconds: {{ .Values.prometheus.setupJob.activeDeadlineSeconds | default 3600 }}
  template:
    spec:
      {{- include "image_pull_secrets" $ | indent 6 }}
      containers:
      - name: {{ .Release.Name }}-prometheus-setup
        image: {{ include "job.image" $ }}
        securityContext: {{ default .Values.jobs.securityContext | toYaml | nindent 10 }}
        env:
        - name: X_TARDIS_GATEWAY_ADMIN_BASE64
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}
              key: gatewayAdminBase64
        {{- if eq .Values.rbac.enabled true }}
        - name: KONG_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}
              key: kongAdminPassword
        {{- end }}
        command:        
          - /bin/bash
          - -c
          - |-
            echo "Enabling Kong ENI flavoured Prometheus plugin via PUT {{ include "kong.adminApi.serviceUrl" . }}/plugins"

            ADMIN_API_HTTP_RETURN_CODE=`curl -Is -o /dev/null -w "%{http_code}" -H "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN_BASE64" {{ if eq .Values.rbac.enabled true -}}-H "Kong-Admin-Token:$KONG_ADMIN_PASSWORD"{{- end }} -X GET {{ include "kong.adminApi.serviceUrl" . }}`
            if [ "$ADMIN_API_HTTP_RETURN_CODE" == "200" ]; then
                echo "Kong Admin-API unreachable"
                exit 1
            fi

            CONFIG_CALL_HTTP_RETURN_CODE=`curl \
            -w "%{http_code}" \
            -H "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN_BASE64" \
            {{- if eq .Values.rbac.enabled true }}
            -H "Kong-Admin-Token:$KONG_ADMIN_PASSWORD" \
            {{- end }}
            -X PUT {{ include "kong.adminApi.serviceUrl" . }}/plugins/{{ .Values.prometheus.setupJob.pluginId }} \
            --header 'Content-Type: application/json' \
            --data \
            '{
              "name" : "prometheus",
              "tags" : ["tardis","prometheus","eni-prometheus"],
              "config" : {
                "customer_facing" : "{{ .Values.prometheus.setupJob.customer_facing | default false }}",
                "eni_stat" : true
              }
            }'`

            if [ "$CONFIG_CALL_HTTP_RETURN_CODE" != "200" ] && [ "$CONFIG_CALL_HTTP_RETURN_CODE" != "201"]; then
              echo "Configuring plugin failed"
              exit 1
            fi
      restartPolicy: OnFailure
{{- end -}}
