{{- if eq .Values.global.platform "openshift" }}
{{- if .Values.exposeAdminApi }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Release.Name }}-admin
  labels: {{ include "kong.labels" $ | nindent 4 }}
spec:
  host: {{ .Release.Name }}-admin-{{ .Release.Namespace }}.{{ .Values.global.domain.internal.url }}
  port:
    targetPort: kong-admin-ssl
  to:
    kind: Service
    name: {{ .Release.Name }}-admin
    weight: 100
  tls:
    termination: passthrough
status:
  ingress:
    - host: ""
{{- end }}
{{- end }}
