{{- if eq .Values.global.platform "openshift" -}}
{{- if .Values.exposeAdminApi }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Release.Name }}-admin
  labels: {{ include "kong.labels" $ | nindent 4 }}
spec:
  host: {{ .Release.Name }}-admin-{{ .Release.Namespace }}.{{ .Values.global.domain }}
  port:
    targetPort: kong-admin
  to:
    kind: Service
    name: {{ .Release.Name }}-admin
    weight: 100
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
status:
  ingress:
    - host: ""
{{- end -}}
{{- end -}}
