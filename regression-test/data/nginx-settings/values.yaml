issuerService:
  jsonWebKey: ignore
  publicKey: ignore

plugins:
  jwtKeycloak:
    allowedIss: 
      - https://somehost.tardis.telekom.de/auth/realms/default

global:
  database:
    password: someDbPassword

adminApi:
  gatewayAdminApiKey: someAdminPassword

# changed ssl settings
ssl:
  protocols: "TLSv1.2"
  ciphers: "DHE-DSS-AES128-SHA256"

# changed nginx settings
memCacheSize: 256m
nginxWorkerProcesses: 100
nginxHttpLuaSharedDict: prometheus_metrics 30m
nginxLargeClientBuffers: 8 16k
