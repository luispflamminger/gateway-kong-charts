# Source: stargate/templates/job-prometheus-setup.yml
apiVersion: batch/v1
kind: Job
metadata:
  name: stargate-prometheus-setup
  labels: 
    app: stargate
    helm.sh/chart: stargate-0.0.0
    app.kubernetes.io/name: kong
    app.kubernetes.io/instance: stargate-kong
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: tif-runtime
    tif.telekom.de/group: tif
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 15
  activeDeadlineSeconds: 3600
  template:
    spec:      
      containers:
      - name: prometheus-setup
        image: mtr.devops.telekom.de/tardis-common/tif-base-image:1.0.0
        securityContext: 
          {}
        env:
        - name: X_TARDIS_GATEWAY_ADMIN
          valueFrom:
            secretKeyRef:
              name: stargate
              key: gatewayAdminApiKey
        command:        
          - /bin/bash
          - -c
          - |-
            echo "Enabling Kong ENI flavoured Prometheus plugin via PUT http://stargate-admin.default:8001/plugins"

            ADMIN_API_HTTP_RETURN_CODE=`curl -Is -o /dev/null -w "%{http_code}" -H "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN" -X GET http://stargate-admin.default:8001`
            if [ "$ADMIN_API_HTTP_RETURN_CODE" != "200" ]; then
                echo "Kong Admin-API unreachable"
                exit 1
            fi

            CONFIG_CALL_HTTP_RETURN_CODE=`curl \
            -o /dev/null \
            -w "%{http_code}" \
            -H "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN" \
            -X PUT http://stargate-admin.default:8001/plugins/3d232d3c-dc2b-4705-aa8d-4e07c4e0ff4c \
            --header 'Content-Type: application/json' \
            --data \
            '{
              "name" : "prometheus",
              "tags" : ["tardis","prometheus","eni-prometheus"],
              "config" : {
                "customer_facing" : "false",
                "status_code_metrics" : true,
                "latency_metrics" : true,
                "upstream_health_metrics" : true,
                "bandwidth_metrics" : true,
                "per_consumer" : true,
                "eni_stat" : true
              }
            }'`

            if [ "$CONFIG_CALL_HTTP_RETURN_CODE" != "200" ] && [ "$CONFIG_CALL_HTTP_RETURN_CODE" != "201" ]; then
              echo "Configuring plugin failed"
              exit 1
            fi
      restartPolicy: OnFailure
