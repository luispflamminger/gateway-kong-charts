data:
  configuration.sh: |
    echo ""
    echo "1) Create service (upstream:http://stargate-admin.default:8001)"
    curl --request PUT \
      --url http://stargate-admin.default:8001/services/admin-api \
      --header 'Content-Type: application/json' \
      --header "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN" \
      --data \
      '{
        "name": "admin-api",
        "host": "localhost",
        "protocol": "http",
        "port": 8001
      }'

    echo ""
    echo "2) Create request transformer plugin for setting api key header"
    curl --request PUT \
      --url http://stargate-admin.default:8001/services/admin-api/plugins/e9fb4272-0aff-4208-9efa-6bfec5d9df53 \
      --header 'Content-Type: application/json' \
      --header "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN" \
      --data \
      '{
        "name": "request-transformer",
        "config": {
          "replace": {"headers": ["'"Authorization:Basic $X_TARDIS_GATEWAY_ADMIN"'"]}
        }
      }'

    echo ""
    echo "3) Create route (/admin-api) variable: hosts"
    curl --request PUT \
      --url http://stargate-admin.default:8001/services/admin-api/routes/admin-api \
      --header 'Content-Type: application/json' \
      --header "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN" \
      --data \
      '{
        "name": "admin-api",
        "protocols": ["http","https"],
        "hosts": [
          "stargate-admin-default.lab.tardis.telekom.de"
        ],
        "paths": [
          "/admin-api"
        ]
      }'

    echo ""
    echo "4) Create consumer (rover)"
    curl --request PUT \
      --url http://stargate-admin.default:8001/consumers/rover \
      --header 'Content-Type: application/json' \
      --header "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN" \
      --data '{"username" : "rover","custom_id": "rover"}'

    echo ""
    echo "5) Apply ACL plugin to route (/admin-api)"
    echo "and allow group (rover)"
    curl --request PUT \
      --url http://stargate-admin.default:8001/routes/admin-api/plugins/bc823d55-83b5-4184-b03f-ce63cd3b75c7 \
      --header 'Content-Type: application/json' \
      --header "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN" \
      --data \
      '{
        "name": "acl",
        "config": {
          "allow":["rover"],
          "hide_groups_header": true
        }
      }'

    echo ""
    echo "6) Add consumer (rover) to group (rover)"
    curl --request POST \
      --url http://stargate-admin.default:8001/consumers/rover/acls \
      --header 'Content-Type: application/json' \
      --header "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN" \
      --data '{"group":"rover"}'
    echo ""
    echo "7) Setup plugin (jwt-keycloak)"
    echo "variable [allowed_iss]"
    curl --request PUT \
      --url http://stargate-admin.default:8001/routes/admin-api/plugins/b864d58b-7183-4889-8b32-0b92d6c4d513 \
      --header 'Content-Type: application/json' \
      --header "Authorization:Basic $X_TARDIS_GATEWAY_ADMIN" \
      --data \
      '{
        "name": "jwt-keycloak",
        "config": {
          "allowed_iss" : ["https://somehost.tardis.telekom.de/auth/realms/default"],
          "consumer_match" : true,
          "consumer_match_claim_custom_id" : true
        }
      }'
