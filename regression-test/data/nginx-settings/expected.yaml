          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
      volumes:
      - name: stargate-postgresql-run
        emptyDir: {}
      - name: stargate-postgresql-tmp
        emptyDir: {}
      - name: stargate-postgresql-data
        persistentVolumeClaim:
          claimName: stargate-database-pvc
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30
