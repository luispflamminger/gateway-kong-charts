        tardis.telekom.de/namespace: "default"
        tardis.telekom.de/product: "stargate"
        tardis.telekom.de/team: "io"
        tardis.telekom.de/environment: "default"
        tardis.telekom.de/subproduct: "stargate-database"
    spec:      
      securityContext: 
        fsGroup: 999
      containers:
