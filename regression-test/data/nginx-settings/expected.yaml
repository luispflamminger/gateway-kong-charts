# Source: stargate/templates/configmap-nginx-servers.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: stargate-nginx-servers
  labels:
    app: stargate
    helm.sh/chart: stargate-0.0.0
    app.kubernetes.io/name: kong
    app.kubernetes.io/instance: stargate-kong
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: tif-runtime
    tif.telekom.de/group: tif
data:
  servers.conf: |
      # Kong Prometheus Exporter
      server {
          server_name kong_prometheus_exporter;
          listen 0.0.0.0:9542;
          access_log off;

          location /metrics {
              default_type text/plain;
              content_by_lua_block {
                  local prometheus = require "kong.plugins.prometheus.exporter"
                  prometheus:collect()
              }
          }

          location /nginx_status {
              internal;
              stub_status;
          }
      }
