  template:
    metadata:
      labels:
        app: stargate
        helm.sh/chart: postgresql-1.0.0
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: stargate-postgresql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: tif-runtime
