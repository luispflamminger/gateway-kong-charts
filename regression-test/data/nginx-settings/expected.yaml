          {}
        ports:
        - containerPort: 5432
          protocol: TCP
        volumeMounts:
        - mountPath: /tmp
          name: stargate-postgresql-tmp
        - mountPath: /var/run/postgresql
          name: stargate-postgresql-run
        - mountPath: /var/lib/postgresql/data
