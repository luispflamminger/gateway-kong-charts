data:
  nginx_kong.lua: |
  
    return [[
    charset UTF-8;
    server_tokens off;
    
    error_log ${{PROXY_ERROR_LOG}} ${{LOG_LEVEL}};
    
    lua_package_path       '${{LUA_PACKAGE_PATH}};;';
    lua_package_cpath      '${{LUA_PACKAGE_CPATH}};;';
    lua_socket_pool_size   ${{LUA_SOCKET_POOL_SIZE}};
    lua_socket_log_errors  off;
    lua_max_running_timers 4096;
    lua_max_pending_timers 16384;
    lua_ssl_verify_depth   ${{LUA_SSL_VERIFY_DEPTH}};
    > if lua_ssl_trusted_certificate_combined then
    lua_ssl_trusted_certificate '${{LUA_SSL_TRUSTED_CERTIFICATE_COMBINED}}';
    > end
    
    lua_shared_dict kong                        5m;
    lua_shared_dict kong_locks                  8m;
    lua_shared_dict kong_healthchecks           5m;
    lua_shared_dict kong_process_events         5m;
    lua_shared_dict kong_cluster_events         5m;
    lua_shared_dict kong_rate_limiting_counters 12m;
    lua_shared_dict kong_core_db_cache          ${{MEM_CACHE_SIZE}};
    lua_shared_dict kong_core_db_cache_miss     12m;
    lua_shared_dict kong_db_cache               ${{MEM_CACHE_SIZE}};
    lua_shared_dict kong_db_cache_miss          12m;
    > if database == "off" then
    lua_shared_dict kong_core_db_cache_2        ${{MEM_CACHE_SIZE}};
    lua_shared_dict kong_core_db_cache_miss_2   12m;
    lua_shared_dict kong_db_cache_2             ${{MEM_CACHE_SIZE}};
    lua_shared_dict kong_db_cache_miss_2        12m;
    > end
    > if database == "cassandra" then
    lua_shared_dict kong_cassandra              5m;
    > end
    
    underscores_in_headers on;
    > if ssl_ciphers then
    ssl_ciphers ${{SSL_CIPHERS}};
    > end
    
    # injected nginx_http_* directives
    > for _, el in ipairs(nginx_http_directives) do
    $(el.name) $(el.value);
    > end
    
    init_by_lua_block {
        Kong = require 'kong'
        Kong.init()
    }
    
    init_worker_by_lua_block {
        Kong.init_worker()
    }
    
    > if (role == "traditional" or role == "data_plane") and #proxy_listeners > 0 then
    upstream kong_upstream {
        server 0.0.0.1;
    
        # injected nginx_upstream_* directives
    > for _, el in ipairs(nginx_upstream_directives) do
        $(el.name) $(el.value);
    > end
    
        balancer_by_lua_block {
            Kong.balancer()
        }
    }
    
    # TARDIS log formats for proxy port
    
    log_format log_proxy_json '{ "@timestamp": "$time_iso8601", '
                                 '"@service": "proxy", '
                                 '"@fields": { '
                                   '"source": "$http_x_original_forwarded_for", '
                                   '"source_internal": "$http_x_real_ip", '
                                   '"status": "$status", '
                                   '"request_method": "$request_method", '
                                   '"request_path": "$uri", '
                                   '"hostname_ingress": "$host", '
                                   '"hostname_upstream": "$http_remote_api_url", '
                                   '"X-B3-TraceId": "$http_x_b3_traceid", '
                                   '"upstream_status": "$upstream_status", '
                                   '"tardis_consumer": "$tardis_consumer", '
                                   '"eventclassid": "$sec_event_code", '
                                   '"event_details": "$sec_event_details" } }';
    
    log_format log_proxy_debug_json '{ "@timestamp": "$time_iso8601", '
                                 '"@service": "proxy", '
                                 '"@fields": { '
                                   '"source": "$http_x_original_forwarded_for", '
                                   '"source_internal": "$http_x_real_ip", '
                                   '"status": "$status", '
                                   '"request_method": "$request_method", '
                                   '"request_path": "$uri", '
                                   '"request_time": "$request_time", '
                                   '"request_length": "$request_length", '
                                   '"response_body_length": "$body_bytes_sent", '
                                   '"connection_id": "$connection", '
                                   '"connection_requests": "$connection_requests", '
                                   '"hostname_ingress": "$host", '
                                   '"hostname_upstream": "$http_remote_api_url", '
                                   '"X-B3-TraceId": "$http_x_b3_traceid", '
                                   '"upstream_response_length": "$upstream_response_length", '
                                   '"upstream_response_time": "$upstream_response_time", '
                                   '"upstream_status": "$upstream_status", '
                                   '"tardis_consumer": "$tardis_consumer", '
                                   '"eventclassid": "$sec_event_code", '
                                   '"event_details": "$sec_event_details", '
                                   '"http_user_agent": "$http_user_agent" } }';
    
    # TARDIS log formats for admin port
    
    log_format log_admin_json '{ "@timestamp": "$time_iso8601", '
                                 '"@service": "admin", '
                                 '"@fields": { '
                                   '"source": "$http_x_original_forwarded_for", '
                                   '"source_internal": "$http_x_real_ip", '
                                   '"remote_user": "$remote_user", '
                                   '"status": "$status", '
                                   '"request_method": "$request_method", '
                                   '"request_path": "$uri", '
                                   '"hostname_ingress": "$host", '
                                   '"eventclassid": "$sec_event_code", '
                                   '"event_details": "$sec_event_details" } }';
    
    log_format log_admin_debug_json '{ "@timestamp": "$time_iso8601", '
                                 '"@service": "admin", '
                                 '"@fields": { '
                                   '"source": "$http_x_original_forwarded_for", '
                                   '"source_internal": "$http_x_real_ip", '
                                   '"remote_user": "$remote_user", '
                                   '"status": "$status", '
                                   '"request_method": "$request_method", '
                                   '"request_path": "$uri", '
                                   '"request_protocol": "$server_protocol", '
                                   '"request_time": "$request_time", '
                                   '"request_completion": "$request_completion", '
                                   '"request_length": "$request_length", '
                                   '"response_body_length": "$body_bytes_sent", '
                                   '"content_length": "$content_length", '
                                   '"content_type": "$content_type", '
                                   '"connection_id": "$connection", '
                                   '"connection_requests": "$connection_requests", '
                                   '"hostname_ingress": "$host", '
                                   '"hostname_pod": "$hostname", '
                                   '"eventclassid": "$sec_event_code", '
                                   '"event_details": "$sec_event_details", '
                                   '"http_user_agent": "$http_user_agent" } }';
    
    server {
        server_name kong;
    > for _, entry in ipairs(proxy_listeners) do
        listen $(entry.listener);
    > end
    
        error_page 400 404 408 411 412 413 414 417 494 /kong_error_handler;
        error_page 500 502 503 504                     /kong_error_handler;
    
        access_log ${{PROXY_ACCESS_LOG}} log_proxy_json;
        error_log  ${{PROXY_ERROR_LOG}} ${{LOG_LEVEL}};
    
    > if proxy_ssl_enabled then
    > for i = 1, #ssl_cert do
        ssl_certificate     $(ssl_cert[i]);
        ssl_certificate_key $(ssl_cert_key[i]);
    > end
        ssl_session_cache   shared:SSL:10m;
        ssl_certificate_by_lua_block {
            Kong.ssl_certificate()
        }
    > end
    
        # injected nginx_proxy_* directives
    > for _, el in ipairs(nginx_proxy_directives) do
        $(el.name) $(el.value);
    > end
    > for _, ip in ipairs(trusted_ips) do
        set_real_ip_from $(ip);
