postgresql:
  podSecurityContext:
    fsGroup: 999
    supplementalGroups: [999]    
  containerSecurityContext:
    runAsGroup: 999
    runAsUser: 999
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop:
      - ALL
