global:
  platform: "kubernetes"
  project_prefix: "tif-"
  storageclass: "cns"
  domain:
    internal:
      url: "changeme-internal.tif.telekom.de"

enterprise:
  license: changeme

manager:
  enabled: false
  enableAuth: false

externalDatabase:
  enabled: false
# host: some-external-postgresql-database.example.com
# port: '5432'

# Warning: Might be unsecure to expose the adminapi
exposeAdminApi: false

replicas: 1

resources:
  requests:
    cpu: 750m
    memory: 1024Mi

postgres:
# image: 'postgres:9.6'
  # use this image for OpenShift environments due to security restrictions
  image: 'mtr.external.otc.telekomcloud.com/tifpackages/postgresql-96-centos7:master'
  pvc:
    keepOnDelete: false
  
# data_locations: '/var/lib/postgresql/data'
  # use this data location for postgresql-95-rhel7 based postgres images
  data_locations: '/var/lib/pgsql/data'

# port: 5432

  database: kong  
  user: kong
  password: changeme

  replicas: 1

  resources:
    limits:
      memory: "512Mi"
