global:
  platform: kubernetes
  storageclass: gp2
  domain: ""
  labels:
    # fluentd label
    tif.telekom.de/group: tif
  ingress:
    annotations: {}
      #external-dns.alpha.kubernetes.io/target: ""
      #kubernetes.io/ingress.class: ""

  # If imagePullSecrets is not empty, a pull secret will be deployed for each entry otherwise 
  # no pull secret will be deployed
  # If you use Sapling for deployment this will be set automatically
  imagePullSecrets: []
  #- name: mtr-tif-public
  #  registry: https://mtr.external.otc.telekomcloud.com
  #  username: changeme
  #  password: changeme

# You can list files (in /templates) here that should cause a re-deployment of your application
# when their contents change
# This makes sense if you change configMaps or secrets and you
# want your deployment to use the latest configuration
#
#templateChangeTriggers:
#- my-custom-configmap.yaml
#- my-custom-kong-plugin.yaml
templateChangeTriggers: []

# You can force using a specific image here:
#image: 
  #repository: mtr.external.otc.telekomcloud.com
  #organization: tif-public
  #name: tif-kong-ee
  #tag: 1.0.0
# Or use the flattened string form:
#image: mtr.external.otc.telekomcloud.com/tif-public/tif-kong-ee:1.0.0

enterprise:
  license: ""

# Warning: 
# If you disable RBAC exposing the Admin API can be dangerous
# Note that RBAC will only work when Kong in running in enterprise edition (enterprise.license is provided) 
rbac:
  enabled: true
  kongAdminPassword: "changeme"

# You can add custom plugins here:
# Note:
# The plugins must be deployed as configmaps and correctly referenced here
# You can either deploy the configmaps seperaty in a previous process
# or you place the configmaps into the templates directory of this Helm chart
#
# Note: If your configMap name will not change with future updates of your Kong plugin (e.g.: no checksum in name)
# you can list the configMap yaml file in the templateChangeTriggers list above
# to tigger a re-deployment of Kong
#
# customPlugins:
#   - name: custom1
#     configMap: kong-plugin-custom1-5e67ca89
#   - name: custom2
#     configMap: kong-plugin-custom2-6a2bc71b
customPlugins: []

# Enable Admin API and whether it is http or https
# Warning: 
# Enabled Admin API with disabled RBAC can be dangerous
adminApi:
  enabled: true
  tls:
    enabled: false
# Activate Admin API ingress and set a dedicated hostname
  ingress:
    enabled: true
    # hostname: ""
    annotations: {}

# Configure Kong Manager
manager:
  enabled: true
  tls:
    enabled: false
  session:
    secret: changeme
  ingress:
    enabled: true
    # hostname: ""
    annotations: {}

# Configure the Portal
portal:
  enabled: false
  tls:
    enabled: false
  session:
    secret: changeme
  ingress:
    enabled: true
    # hostname: ""
    annotations: {}

# Activate proxy ingress and set a dedicated hostname
proxy:
  ingress:
    enabled: true
    # hostname: ""
    annotations:
      nginx.ingress.kubernetes.io/ssl-passthrough: "true"

# values used by nginx directives
sslVerify: false
sslVerifyDepth: '1'

# You can define the truststore for SSL verification by setting your CAs in PEM format here 
#
# trustedCaCertificates: |
#   -----BEGIN CERTIFICATE-----
#   <CA certificate 01 in PEM format here>
#   -----END CERTIFICATE-----
#   -----BEGIN CERTIFICATE-----
#   <CA certificate 02 in PEM format here>
#   -----END CERTIFICATE-----
#   -----BEGIN CERTIFICATE-----
#   <CA certificate 03 in PEM format here>
#   -----END CERTIFICATE-----

# You can define the default HTTPS server certificate by specifing the secret with private-key/certificate here
# Note: additional route-specific server certificates can by configured and assigned to SNIs at runtime. This is only a default certificate
#
# defaultTlsSecret: "mysecret"

disableUpstreamCache: false

securityContext:
  privileged: false
  runAsNonRoot: true

jobs:
  securityContext:
    privileged: false
    runAsNonRoot: true

replicas: 1

resources:
  limits:
    cpu: 0.5
    memory: 500Mi
  requests:
    cpu: 50m
    memory: 200Mi

zipkin:
  enabled: false
  collectorUrl: ""
  # sampleRatio: 0.001
  # includeCredential: "true"
  # defaultServiceName: "kong-apigateway"
  # Set job retries and maximum runtime (default values preset)
  # setupJob:
  #   backoffLimit: 20
  #   activeDeadlineSeconds: 300
  # luaSslTrustedCertificate: |
  #   -----BEGIN CERTIFICATE-----
  #   <CA certificate in PEM format here>
  #   -----END CERTIFICATE-----

prometheus:
  enabled: true 
# port: 9542
# path: /metrics
# setupJob:
#   backoffLimit: 20
#   activeDeadlineSeconds: 300

# Jumper is a component needed for Gateway-to-Gateway
# communication
jumper:
  enabled: true
  #image: 
    #repository: mtr.external.otc.telekomcloud.com
    #organization: tif-public
    #name: jumper
    #tag: 1.0.0
  # Or use the flattened string form:
  #image: mtr.external.otc.telekomcloud.com/tif-public/jumper:1.0.0

  securityContext:
    privileged: false
    runAsNonRoot: true

  resources:
    limits:
      cpu: 0.5
      memory: 500Mi
    requests:
      cpu: 50m
      memory: 200Mi

postgres:
  # You can force using a specific image here:
  #image: 
    #repository: mtr.external.otc.telekomcloud.com
    #organization: tif-public
    #name: postgres
    #tag: 12.3-debian
  # Or use the flattened string form:
  #image: mtr.external.otc.telekomcloud.com/tif-public/postgres:12.3-debian

  # If set to true, the bundled PostgreSQL will not be deployed
  externalDatabase: 
    enabled: false
    # ssl: false
    # sslVerify: false
    # luaSslTrustedCertificate: |
    #   -----BEGIN CERTIFICATE-----
    #   <CA certificate in PEM format here>
    #   -----END CERTIFICATE-----
  
  # Set host if you use an external database or service name is not sufficient
  # host: 'some-external-postgresql-database.example.com'
  port: 5432
  database: kong
  user: kong
  password: changeme
  
  persistence:
    keepOnDelete: false
    #mountDir: '/var/lib/postgresql/data'
    
    resources:
      requests:
        storage: 1Gi

  securityContext:
    privileged: false
    runAsNonRoot: true

  replicas: 1

  resources:
    limits:
      cpu: 100m
      memory: 500Mi
    requests:
      cpu: 20m
      memory: 200Mi