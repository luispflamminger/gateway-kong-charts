global:
  platform: "kubernetes"
  project_prefix: "tif-"
  storageclass: "cns"
  externalDnsTarget: changeme
  domain: ""

  # If imagePullSecrets is not empty, a pull secret will be deployed for each entry otherwise no pull secret will be deployed
  # If you use tif-infra-pipeline (TIF installer) this will be set automatically
  # imagePullSecrets:
  #   - name: mtr-tif-public
  #     registry: https://mtr.external.otc.telekomcloud.com
  #     username: changeme
  #     password: changeme
  imagePullSecrets: []

# You can list files (in /templates) here that should cause a re-deployment of your application
# when their contents change
# This makes sense if you change configMaps or secrets and you
# want your deployment to use the latest configuration
#
# templateChangeTriggers:
#   - my-custom-configmap.yaml
#   - my-custom-kong-plugin.yaml
templateChangeTriggers:
  - configmap-tif-dhei-defaults.yaml

# You can force using a specific image here:
# image: 'mtr.external.otc.telekomcloud.com/tif-public/tif-kong-ee:1.0.0-beta.1-1.3.0.2-alpine'

enterprise:
  license: changeme

manager:
  enabled: true
  session:
    secret: changeme

portal:
  enabled: false
  session:
    secret: changeme

# Warning: 
# If you disable RBAC exposing the Admin API can be dangerous
rbac:
  enabled: true
  kongAdminPassword: changeme

# You can add custom plugins here:
# Note:
# The plugins must be deployed as configmaps and correctly referenced here
# You can either deploy the configmaps seperaty in a previous process
# or you place the configmaps into the templates directory of this Helm chart
#
# Note: If your configMap name will not change with future updates of your Kong plugin (e.g.: no checksum in name)
# you can list the configMap yaml file in the templateChangeTriggers list above
# to tigger a re-deployment of Kong
#
# customPlugins:
#   - name: custom1
#     configMap: kong-plugin-custom1-5e67ca89
#   - name: custom2
#     configMap: kong-plugin-custom2-6a2bc71b
customPlugins: []

# If you want to change the default trusted CA certificates
# you can do so by referencing a configMap and a key here to point
# to the chain of CAs in PEM format 
# Please have a look at the default configMap configmap-tif-dhei-defaults.yaml
# and the NGINX documentation here:
# https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_ssl_trusted_certificate
#
# Note: If your configMap name will not change with future updates of your Kong plugin (e.g.: no checksum in name)
# you can list the configMap yaml file in the templateChangeTriggers list above
# to tigger a re-deployment of Kong
#
# trustedCaCertificates:
#   configMap: my-kong-apigateway-config
#   key: trusted-ca-certificates.pem
trustedCaCertificates: {}

externalDatabase:
  enabled: false
# host: some-external-postgresql-database.example.com
# port: '5432'

# Warning: 
# If you disable rbac exposing the Admin API can be dangerous
exposeAdminApi: true

# values used by nginx directives
sslVerify: false
sslVerifyDepth: '1'
disableUpstreamCache: false

replicas: 1

resources:
  requests:
    cpu: 750m
    memory: 1024Mi

postgres:
  pvc:
    keepOnDelete: false
  
# data_locations: '/var/lib/postgresql/data'
  # use this data location for postgresql-95-rhel7 based postgres images
  data_locations: '/var/lib/pgsql/data'

# port: 5432

  database: kong  
  user: kong
  password: changeme

  replicas: 1

  resources:
    limits:
      memory: "512Mi"
