global:
  platform: "kubernetes"
  project_prefix: "tif-"
  storageclass: "cns"
  domain:
    internal:
      url: "changeme-internal.tif.telekom.de"

enterprise:
  license: changeme

manager:
  enabled: false

portal:
  enabled: false

rbac:
  enabled: true
  kong_password: changeme

externalDatabase:
  enabled: false
# host: some-external-postgresql-database.example.com
# port: '5432'

# Warning: 
# If you disable rbac exposing the Admin API can be dangerous
exposeAdminApi: true

replicas: 1

resources:
  requests:
    cpu: 750m
    memory: 1024Mi

postgres:
  pvc:
    keepOnDelete: false
  
# data_locations: '/var/lib/postgresql/data'
  # use this data location for postgresql-95-rhel7 based postgres images
  data_locations: '/var/lib/pgsql/data'

# port: 5432

  database: kong  
  user: kong
  password: changeme

  replicas: 1

  resources:
    limits:
      memory: "512Mi"
