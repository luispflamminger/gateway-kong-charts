global:
  metadata:
    pipeline: {}

  platform: kubernetes
  storageclass: gp2
  domain: ""
  labels:
    # fluentd label
    tif.telekom.de/group: tif
  ingress:
    annotations: {}
      #external-dns.alpha.kubernetes.io/target: ""
      #kubernetes.io/ingress.class: ""

  # If imagePullSecrets is not empty, a pull secret will be deployed for each entry otherwise 
  # no pull secret will be deployed
  # If you use Sapling for deployment this will be set automatically
  imagePullSecrets: 
  #- name: mtr-tif-public
  #  registry: https://mtr.external.otc.telekomcloud.com
  #  username: changeme
  #  password: changeme

  passwordRules:
    enabled: false
    length: 12
    mustMatch:
    - '[a-z]'
    - '[A-Z]'
    - '[0-9]'
    - '[^a-zA-Z0-9]'

# You can list files (in /templates) here that should cause a re-deployment of your application
# when their contents change
# This makes sense if you change configMaps or secrets and you
# want your deployment to use the latest configuration
#
#templateChangeTriggers:
#- my-custom-configmap.yaml
templateChangeTriggers: []

# You can force using a specific image here:
#image: 
  #repository: mtr.external.otc.telekomcloud.com
  #organization: tif-public
  #name: kong
  #tag: 2.3.2-alpine-ce
# Or use the flattened string form:
#image: mtr.external.otc.telekomcloud.com/tif-public/kong:2.3.2-alpine-ce

# Determine the migrations behaviour (bootstrap or upgrade)
# Comment out if none of the options are needed
migrations: bootstrap

enterprise:
  license: ""

# Warning: 
# If you disable RBAC exposing the Admin API can be dangerous
# Note that RBAC will only work when Kong in running in enterprise edition (enterprise.license is provided) 
rbac:
  enabled: true
  kongAdminPassword: "changeme"

# Enable Admin API and whether it is http or https
# Warning: 
# Enabled Admin API with disabled RBAC can be dangerous
adminApi:
  enabled: true
  tls:
    enabled: false
# Activate Admin API ingress and set a dedicated hostname
# For EE (license) this is default true, for CE (no license) this is default false
  ingress:
    enabled: true
    #hostname: ""
    annotations: {}
  #access_log: /dev/stdout
  #error_log: /dev/stderr

# Configure Kong Manager
manager:
  enabled: true
  tls:
    enabled: false
  session:
    secret: changeme
  ingress:
    enabled: true
    #hostname: ""
    annotations: {}
  #access_log: /dev/stdout
  #error_log: /dev/stderr

# Configure the Portal
portal:
  enabled: false
  tls:
    enabled: false
  session:
    secret: changeme
  ingress:
    enabled: true
    #hostname: ""
    annotations: {}
  #access_log: /dev/stdout
  #error_log: /dev/stderr

# Activate proxy ingress and set a dedicated hostname
proxy:
  tls:
    enabled: false
  ingress:
    enabled: true
    #hostname: ""
    annotations: {}
  #access_log: /dev/stdout
  #error_log: /dev/stderr

#configuration: |
  #Place your curl commands here to configure via Admin-API on deploy time

# values used by nginx directives
sslVerify: false
sslVerifyDepth: '1'

# You can define the truststore for SSL verification by setting your CAs in PEM format here 
#
#trustedCaCertificates: |
#  -----BEGIN CERTIFICATE-----
#  <CA certificate 01 in PEM format here>
#  -----END CERTIFICATE-----
#  -----BEGIN CERTIFICATE-----
#  <CA certificate 02 in PEM format here>
#  -----END CERTIFICATE-----
#  -----BEGIN CERTIFICATE-----
#  <CA certificate 03 in PEM format here>
#  -----END CERTIFICATE-----

# You can define the default HTTPS server certificate by specifing the secret with private-key/certificate here
# Note: additional route-specific server certificates can by configured and assigned to SNIs at runtime. This is only a default certificate
#defaultTlsSecret: "mysecret"

disableUpstreamCache: false

securityContext: {}

jobs:
  securityContext: {}

#memCacheSize: 128m
#nginxWorkerProcesses: auto

replicas: 1

resources:
  limits:
    cpu: 1
    memory: 2Gi
  requests:
    cpu: 50m
    memory: 200Mi

zipkin:
  enabled: true
  collectorUrl: "http://jaeger-collector.default:9411/api/v2/spans"
  #sampleRatio: 0.001
  #includeCredential: "true"
  #defaultServiceName: "stargate"
  # Set job retries and maximum runtime (default values preset)
  setupJob:
    pluginId: e8ff1211-816f-4d93-9011-a4b194586073
    #backoffLimit: 15
    #activeDeadlineSeconds: 3600
    #luaSslTrustedCertificate: |
    #  -----BEGIN CERTIFICATE-----
    #  <CA certificate in PEM format here>
    #  -----END CERTIFICATE-----

prometheus:
  enabled: true 
# port: 9542
# path: /metrics
  setupJob:
    pluginId: 3d232d3c-dc2b-4705-aa8d-4e07c4e0ff4c
    #backoffLimit: 15
    #activeDeadlineSeconds: 3600
  serviceMonitor:   
    enabled: true
    #selector: "guardians-raccoon"
    #scheme: http
    #interval: "15s"
    #scrapeTimeout: "3s"
    #honorLabels: ""
  podMonitor:   
    enabled: false
    #selector: "guardians-raccoon"
    #scheme: http
    #interval: "15s"
    #scrapeTimeout: "3s"
    #honorLabels: ""
    
jwtKeycloak:
  enabled: true
  setupJob:
    pluginId: b864d58b-7183-4889-8b32-0b92d6c4d513
    allowedIss: 
      - https://changeme/auth/realms/default

kong_admin:
  enabled: true
  #token: changeme
  setupJob: {}
  #  backoffLimit: 15
  #  activeDeadlineSeconds: 3600

plugins:
  enabled: []
  initContainer:
    #image: 
      #repository: mtr.external.otc.telekomcloud.com
      #organization: tif-public
      #name: kong-plugins
      #tag: 1.0.0
    # Or use the flattened string form:
    #image: mtr.external.otc.telekomcloud.com/tif-public/kong-plugins:1.1.0
  
    securityContext: {}

# Jumper is a component needed for Gateway-to-Gateway
# communication
jumper:
  enabled: true
  #image: 
    #repository: mtr.external.otc.telekomcloud.com
    #organization: tif-public
    #name: jumper
    #tag: 1.3.5
  # Or use the flattened string form:
  #image: mtr.external.otc.telekomcloud.com/tif-public/jumper:1.3.5
  issuerUrl: https://localhost:443

  securityContext: {}

  resources:
    limits:
      cpu: 0.5
      memory: 1Gi
    requests:
      cpu: 50m
      memory: 200Mi

postgres:
  # You can force using a specific image here:
  #image: 
    #repository: mtr.external.otc.telekomcloud.com
    #organization: tif-public
    #name: postgres
    #tag: 12.3-debian
  # Or use the flattened string form:
  #image: mtr.external.otc.telekomcloud.com/tif-public/postgres:12.3-debian

  # If set to true, the bundled PostgreSQL will not be deployed
  externalDatabase: 
    enabled: false
    #ssl: false
    #sslVerify: false
    #luaSslTrustedCertificate: |
    #  -----BEGIN CERTIFICATE-----
    #  <CA certificate in PEM format here>
    #  -----END CERTIFICATE-----
  
  # Set host if you use an external database or service name is not sufficient
  #host: 'some-external-postgresql-database.example.com'
  port: 5432
  database: kong
  user: kong
  password: changeme
  
  persistence:
    keepOnDelete: false
    #mountDir: '/var/lib/postgresql/data'
    
    resources:
      requests:
        storage: 1Gi

  securityContext: {}

  resources:
    limits:
      cpu: 100m
      memory: 500Mi
    requests:
      cpu: 20m
      memory: 200Mi
