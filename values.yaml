global:
  platform: "kubernetes"
  project_prefix: "tif-"
  storageclass: "cns"
  externalDnsTarget: "changeme"
  domain:
    internal:
      url: "changeme-internal.tif.telekom.de"

enterprise:
  license: changeme

rbac:
  kongPassword: changeme
manager:
  enabled: false
  disableAuth: false

portal:
  enabled: false

externalDatabase:
  enabled: false
# host: some-external-postgresql-database.example.com
# port: '5432'

# Warning: Might be unsecure to expose the adminapi
exposeAdminApi: false

replicas: 1

resources:
  requests:
    cpu: 750m
    memory: 1024Mi

postgres:
  pvc:
    keepOnDelete: false
  
# data_locations: '/var/lib/postgresql/data'
  # use this data location for postgresql-95-rhel7 based postgres images
  data_locations: '/var/lib/pgsql/data'

# port: 5432

  database: kong  
  user: kong
  password: changeme

  replicas: 1

  resources:
    limits:
      memory: "512Mi"
